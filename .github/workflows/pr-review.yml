name: Automatic PR Review with A2A Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR diff
        id: get-diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr-diff.txt
      
      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > changed-files.txt
      
      - name: Call A2A Agent for Review
        id: agent-review
        run: |
          DIFF_CONTENT=$(cat pr-diff.txt | python3 -c "import sys, json; print(json.dumps(sys.stdin.read()))")
          FILES_JSON=$(cat changed-files.txt | python3 -c "import sys, json; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))")
          PR_TITLE=$(echo '${{ github.event.pull_request.title }}' | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip()))")
          PR_BODY=$(echo '${{ github.event.pull_request.body }}' | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip()))")
          
          cat > payload.json <<EOF
          {
            "message": "You are a code reviewer. Please thoroughly review this pull request and provide detailed feedback.\n\nPR #${{ github.event.pull_request.number }}: ${PR_TITLE}\n\nDescription: ${PR_BODY}\n\nChanged Files:\n${FILES_JSON}\n\nCode Changes (Git Diff):\n${DIFF_CONTENT}\n\nPlease analyze the code changes and provide:\n1. A summary of what this PR does\n2. Any bugs, security issues, or code quality problems you find\n3. Specific line-by-line feedback where applicable\n4. Suggestions for improvements\n5. Your recommendation: Approve or Request Changes\n\nFormat your response in markdown with clear sections.",
            "context": {
              "pr_number": "${{ github.event.pull_request.number }}",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.event.pull_request.head.ref }}",
              "base_branch": "${{ github.event.pull_request.base.ref }}",
              "author": "${{ github.event.pull_request.user.login }}",
              "files_changed": ${FILES_JSON}
            }
          }
          EOF
          
          RESPONSE=$(curl -s -X POST \
            "https://servicesessentials.ibm.com/agenticapps/a2a/359c48fb-1ced-489b-a8fb-f889f32b4e11/agents/82273176-2914-4ed1-b0c6-9a5fd21ba874" \
            -H "Authorization: Bearer ${{ secrets.AGENT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @payload.json)
          
          echo "$RESPONSE" > response.json
          
          REVIEW_CONTENT=$(echo "$RESPONSE" | python3 -c "
import sys, json
try:
    response_text = sys.stdin.read()
    if not response_text or response_text.strip() == '':
        print('❌ Error: Agent returned empty response')
        print('This usually means:')
        print('1. The API key may not have permission to invoke this agent')
        print('2. The agent endpoint may be incorrect')
        print('3. The agent may not be deployed or active')
        print('')
        print('Please check:')
        print('- Agent is deployed and active in Agent Studio')
        print('- API key has agent invocation permissions')
        print('- Agent endpoint URL is correct')
        sys.exit(0)
    
    data = json.loads(response_text)
    content = data.get('response') or data.get('message') or data.get('content') or data.get('output')
    
    if content and content.strip() and content.strip() != 'Review completed':
        print(content)
    else:
        print('⚠️ Agent returned empty or generic response.')
        print('')
        print('Full response:')
        print(json.dumps(data, indent=2))
        print('')
        print('This may indicate:')
        print('- Agent needs more explicit instructions')
        print('- Agent configuration needs updating')
        print('- Prompt needs to be more specific')
except json.JSONDecodeError as e:
    print(f'❌ Error: Could not parse agent response as JSON')
    print(f'Error details: {e}')
    print('')
    print('Raw response:')
    print(response_text[:500])
except Exception as e:
    print(f'❌ Unexpected error: {e}')
")
          
          echo "$REVIEW_CONTENT" > review-output.txt
          
          if echo "$REVIEW_CONTENT" | grep -q "Error:"; then
            echo "⚠️ Warning: Agent returned an error"
            echo "Check response.json and review-output.txt in artifacts"
          fi
          
          {
            echo "review<<EOF"
            cat review-output.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT
      
      - name: Post Review as Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewContent = fs.readFileSync('review-output.txt', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Automated PR Review\n\n${reviewContent}\n\n---\n*Review generated by A2A Agent*`
            });
      
      - name: Check Review Decision
        run: |
          REVIEW_CONTENT=$(cat review-output.txt)
          
          if echo "$REVIEW_CONTENT" | grep -qi "Error:"; then
            echo "⚠️ Agent encountered an error - check artifacts"
            exit 0
          elif echo "$REVIEW_CONTENT" | grep -qi "request changes"; then
            echo "⚠️ Agent recommends requesting changes"
            exit 1
          elif echo "$REVIEW_CONTENT" | grep -qi "approve"; then
            echo "✅ Agent approves the changes"
            exit 0
          else
            echo "ℹ️ Review completed without clear decision"
            exit 0
          fi
      
      - name: Upload artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: |
            pr-diff.txt
            payload.json
            response.json
            review-output.txt

