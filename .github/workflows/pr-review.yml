name: Automatic PR Review with A2A Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR diff
        id: get-diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr-diff.txt
      
      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > changed-files.txt
      
      - name: Call A2A Agent for Review
        id: agent-review
        run: |
          DIFF_CONTENT=$(cat pr-diff.txt | python3 -c "import sys, json; print(json.dumps(sys.stdin.read()))")
          FILES_JSON=$(cat changed-files.txt | python3 -c "import sys, json; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))")
          PR_TITLE=$(echo '${{ github.event.pull_request.title }}' | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip()))")
          PR_BODY=$(echo '${{ github.event.pull_request.body }}' | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip()))")
          
          cat > payload.json <<'PAYLOAD_EOF'
          {
            "message": "You are a code reviewer. Please thoroughly review this pull request and provide detailed feedback.\n\nPR #${{ github.event.pull_request.number }}: TITLE_PLACEHOLDER\n\nDescription: BODY_PLACEHOLDER\n\nChanged Files:\nFILES_PLACEHOLDER\n\nCode Changes (Git Diff):\nDIFF_PLACEHOLDER\n\nPlease analyze the code changes and provide:\n1. A summary of what this PR does\n2. Any bugs, security issues, or code quality problems you find\n3. Specific line-by-line feedback where applicable\n4. Suggestions for improvements\n5. Your recommendation: Approve or Request Changes\n\nFormat your response in markdown with clear sections.",
            "context": {
              "pr_number": "${{ github.event.pull_request.number }}",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.event.pull_request.head.ref }}",
              "base_branch": "${{ github.event.pull_request.base.ref }}",
              "author": "${{ github.event.pull_request.user.login }}",
              "files_changed": FILES_JSON_PLACEHOLDER
            }
          }
          PAYLOAD_EOF
          
          # Replace placeholders
          python3 << 'PYTHON_EOF'
          import json
          import os
          
          with open('payload.json', 'r') as f:
              content = f.read()
          
          pr_title = os.environ.get('PR_TITLE', '""')
          pr_body = os.environ.get('PR_BODY', '""')
          files_json = os.environ.get('FILES_JSON', '[]')
          diff_content = os.environ.get('DIFF_CONTENT', '""')
          
          content = content.replace('TITLE_PLACEHOLDER', pr_title)
          content = content.replace('BODY_PLACEHOLDER', pr_body)
          content = content.replace('FILES_JSON_PLACEHOLDER', files_json)
          content = content.replace('DIFF_PLACEHOLDER', diff_content)
          
          with open('payload.json', 'w') as f:
              f.write(content)
          PYTHON_EOF
          
          export PR_TITLE
          export PR_BODY
          export FILES_JSON
          export DIFF_CONTENT
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://servicesessentials.ibm.com/agenticapps/a2a/359c48fb-1ced-489b-a8fb-f889f32b4e11/agents/82273176-2914-4ed1-b0c6-9a5fd21ba874" \
            -H "Authorization: Bearer ${{ secrets.AGENT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @payload.json)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "$RESPONSE_BODY" > response.json
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Error: API returned HTTP $HTTP_CODE"
            echo "Response: $RESPONSE_BODY"
            echo "❌ Error: API returned HTTP $HTTP_CODE" > review-output.txt
            echo "" >> review-output.txt
            echo "Response: $RESPONSE_BODY" >> review-output.txt
          else
            REVIEW_CONTENT=$(echo "$RESPONSE_BODY" | python3 -c "
          import sys, json
          try:
              response_text = sys.stdin.read()
              if not response_text or response_text.strip() == '':
                  print('❌ Error: Agent returned empty response')
                  sys.exit(0)
              
              data = json.loads(response_text)
              content = data.get('response') or data.get('message') or data.get('content') or data.get('output')
              
              if content and content.strip() and content.strip() != 'Review completed':
                  print(content)
              else:
                  print('⚠️ Agent returned empty or generic response.')
                  print('')
                  print('Full response:')
                  print(json.dumps(data, indent=2))
          except json.JSONDecodeError as e:
              print(f'❌ Error: Could not parse response as JSON: {e}')
              print('Raw response:', response_text[:500])
          except Exception as e:
              print(f'❌ Unexpected error: {e}')
          ")
            
            echo "$REVIEW_CONTENT" > review-output.txt
          fi
          
          {
            echo "review<<EOF"
            cat review-output.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT
      
      - name: Post Review as Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewContent = fs.readFileSync('review-output.txt', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Automated PR Review\n\n${reviewContent}\n\n---\n*Review generated by A2A Agent*`
            });
      
      - name: Check Review Decision
        run: |
          REVIEW_CONTENT=$(cat review-output.txt)
          
          if echo "$REVIEW_CONTENT" | grep -qi "Error:"; then
            echo "⚠️ Agent encountered an error - check artifacts"
            exit 0
          elif echo "$REVIEW_CONTENT" | grep -qi "request changes"; then
            echo "⚠️ Agent recommends requesting changes"
            exit 1
          elif echo "$REVIEW_CONTENT" | grep -qi "approve"; then
            echo "✅ Agent approves the changes"
            exit 0
          else
            echo "ℹ️ Review completed without clear decision"
            exit 0
          fi
      
      - name: Upload artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: |
            pr-diff.txt
            payload.json
            response.json
            review-output.txt

