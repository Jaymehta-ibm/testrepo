name: Automatic PR Review with A2A Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR diff
        id: get-diff
        run: |
          # Get the diff between base and head
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr-diff.txt
      
      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > changed-files.txt
      
      - name: Call A2A Agent for Review
        id: agent-review
        run: |
          # Read diff and escape for JSON
          DIFF_CONTENT=$(cat pr-diff.txt | python3 -c "import sys, json; print(json.dumps(sys.stdin.read()))")
          
          # Read changed files as JSON array
          FILES_JSON=$(cat changed-files.txt | python3 -c "import sys, json; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))")
          
          # Escape PR title and description
          PR_TITLE=$(echo '${{ github.event.pull_request.title }}' | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip()))")
          PR_BODY=$(echo '${{ github.event.pull_request.body }}' | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip()))")
          
          # Create detailed review prompt
          cat > payload.json <<EOF
          {
            "message": "You are a code reviewer. Please thoroughly review this pull request and provide detailed feedback.\n\n**PR #${{ github.event.pull_request.number }}**: ${PR_TITLE}\n\n**Description**: ${PR_BODY}\n\n**Repository**: ${{ github.repository }}\n**Branch**: ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}\n**Author**: ${{ github.event.pull_request.user.login }}\n\n**Changed Files**:\n${FILES_JSON}\n\n**Code Changes (Git Diff)**:\n${DIFF_CONTENT}\n\nPlease analyze the code changes and provide:\n1. A summary of what this PR does\n2. Any bugs, security issues, or code quality problems you find\n3. Specific line-by-line feedback where applicable\n4. Suggestions for improvements\n5. Your recommendation: Approve or Request Changes\n\nFormat your response in markdown with clear sections."
          }
          EOF
          
          # Call the A2A Agent
          RESPONSE=$(curl -s -X POST \
            "https://servicesessentials.ibm.com/agenticapps/a2a/359c48fb-1ced-489b-a8fb-f889f32b4e11/agents/82273176-2914-4ed1-b0c6-9a5fd21ba874" \
            -H "Authorization: Bearer ${{ secrets.AGENT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @payload.json)
          
          # Save response for debugging
          echo "$RESPONSE" > response.json
          
          # Extract review content from response
          REVIEW_CONTENT=$(echo "$RESPONSE" | python3 -c '
import sys, json
try:
    data = json.load(sys.stdin)
    if data.get("status") == "error" or "error" in data:
        print("❌ Agent Error:", data.get("error", data.get("message", "Unknown error")))
    else:
        messages = data.get("messages", [])
        for msg in messages:
            if msg.get("role") == "assistant":
                content = msg.get("content", "")
                if content and content.strip():
                    print(content)
                    break
        else:
            content = data.get("response") or data.get("message") or data.get("content") or data.get("output")
            if content and content.strip():
                print(content)
            else:
                print("⚠️ Agent returned empty response")
except Exception as e:
    print("❌ Error parsing response:", str(e))
')
          
          # Save to file for next step
          echo "$REVIEW_CONTENT" > review-output.txt
          
          # Check if we got a meaningful review
          if echo "$REVIEW_CONTENT" | grep -q "Agent returned empty"; then
            echo "⚠️ Warning: Agent did not provide detailed review"
            echo "Check response.json artifact for details"
          fi
          
          # Set output for GitHub Actions
          {
            echo "review<<EOF"
            cat review-output.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT
      
      - name: Post Review as Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewContent = fs.readFileSync('review-output.txt', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Automated PR Review\n\n${reviewContent}\n\n---\n*Review generated by A2A Agent*`
            });
      
      - name: Check Review Decision
        run: |
          REVIEW_CONTENT=$(cat review-output.txt)
          
          if echo "$REVIEW_CONTENT" | grep -qi "request changes"; then
            echo "⚠️ Agent recommends requesting changes"
            exit 1
          elif echo "$REVIEW_CONTENT" | grep -qi "approve"; then
            echo "✅ Agent approves the changes"
            exit 0
          else
            echo "ℹ️ Review completed without clear decision"
            exit 0
          fi
      
      - name: Upload artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: |
            pr-diff.txt
            payload.json
            response.json
            review-output.txt

