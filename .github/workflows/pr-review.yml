name: Automatic PR Review with Langflow Multi-Agent

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  pull-requests: write
  contents: read

jobs:
  review-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        shell: bash
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

          git diff \
            origin/${{ github.event.pull_request.base.ref }}...HEAD \
            > pr-diff.txt

      - name: Get changed files
        shell: bash
        run: |
          git diff --name-only \
            origin/${{ github.event.pull_request.base.ref }}...HEAD \
            > changed-files.txt

      - name: Collect changed file contents
        shell: bash
        run: |
          rm -f changed-code.txt
          touch changed-code.txt

          while IFS= read -r file
          do
            if [ -f "$file" ]; then

              echo "======================" >> changed-code.txt
              echo "FILE: $file" >> changed-code.txt
              echo "======================" >> changed-code.txt

              cat "$file" >> changed-code.txt

              echo "" >> changed-code.txt
              echo "" >> changed-code.txt

            fi
          done < changed-files.txt

      - name: Build payload
        shell: bash
        run: |
          python3 <<'PYTHON_EOF' > payload.json
          import json

          with open("pr-diff.txt", "r", encoding="utf-8") as f:
              diff_content = f.read()

          with open("changed-files.txt", "r", encoding="utf-8") as f:
              changed_files = [
                  line.strip()
                  for line in f
                  if line.strip()
              ]

          with open("changed-code.txt", "r", encoding="utf-8") as f:
              code_content = f.read()

          message = f"""
          You are a senior software engineer performing a deep pull request review.

          Focus heavily on:
          - runtime bugs
          - edge cases
          - code quality
          - maintainability
          - architecture
          - readability
          - validation issues
          - null safety
          - performance
          - testing gaps

          IMPORTANT:
          - Give SPECIFIC code-level feedback
          - Suggest exact fixes
          - Explain runtime impact
          - Avoid generic comments

          Repository:
          ${{ github.repository }}

          PR Number:
          ${{ github.event.pull_request.number }}

          Title:
          ${{ github.event.pull_request.title }}

          Changed Files:
          {chr(10).join(changed_files)}

          Git Diff:
          {diff_content[:5000]}

          Full Changed File Contents:
          {code_content[:10000]}

          Structure response like:
          1. Summary
          2. What looks good
          3. Key issues
          4. Suggestions
          5. Final recommendation

          IMPORTANT:
          Use:
          Recommendation: Approve
          OR
          Recommendation: Request Changes
          """

          payload = {
              "message": message
          }

          print(json.dumps(payload))
          PYTHON_EOF

      - name: Call Langflow Multi-Agent Workflow
        shell: bash
        run: |
          MESSAGE=$(cat payload.json | jq -r '.message')

          MESSAGE_SIZE=$(echo "$MESSAGE" | wc -c)

          echo "Payload size: $MESSAGE_SIZE bytes"

          SESSION_ID=$(uuidgen)

          LANGFLOW_PAYLOAD=$(jq -n \
            --arg msg "$MESSAGE" \
            --arg session "$SESSION_ID" \
            '{
              "output_type": "chat",
              "input_type": "chat",
              "input_value": $msg,
              "session_id": $session,
              "tweaks": {
                "clear_history": true
              }
            }')

          echo "$LANGFLOW_PAYLOAD" > langflow-payload.json

          echo "===== PAYLOAD PREVIEW ====="
          echo "${LANGFLOW_PAYLOAD:0:500}"
          echo ""

          echo "===== CALLING LANGFLOW ====="
          echo "Flow ID: 39b731f3-5f2a-4e7a-a247-2271d864c909"
          echo "Session ID: $SESSION_ID"

          RESPONSE=$(curl --max-time 300 -s -w "\n%{http_code}" -X POST \
            "https://langflow.servicesessentials.ibm.com/api/v1/run/39b731f3-5f2a-4e7a-a247-2271d864c909?stream=false" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.LANGFLOW_API_KEY }}" \
            -d @langflow-payload.json)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status Code: $HTTP_CODE"

          if [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "❌ Langflow request timed out"
            exit 1
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Langflow API failed"
            echo "$RESPONSE_BODY"
            exit 1
          fi

          echo "✅ Langflow API call succeeded"

          echo "$RESPONSE_BODY" > response.json
          echo ""
          echo "===== FULL RAW RESPONSE ====="
          cat response.json
          echo ""
          RESPONSE="$RESPONSE_BODY"

          echo "===== RESPONSE PREVIEW ====="
          echo "${RESPONSE:0:1000}"
          echo ""

          if [ -n "$RESPONSE" ] && echo "$RESPONSE" | jq empty >/dev/null 2>&1; then

            echo "✅ Valid JSON response received"
          
            REVIEW_CONTENT=$(echo "$RESPONSE" | jq -r '
              first(.. | .text? // empty)
            ')
          
            if [ -z "$REVIEW_CONTENT" ]; then
              REVIEW_CONTENT="⚠️ No review content found"
            fi
          
          else
            REVIEW_CONTENT="❌ Invalid JSON response from API"
          fi

          echo ""
          echo "===== EXTRACTED REVIEW CONTENT ====="
          echo "$REVIEW_CONTENT"
          echo "===================================="
          echo ""
          
          echo "$REVIEW_CONTENT" > review-output.txt
          
          echo "✅ Review content saved to review-output.txt"
          
          echo ""
          echo "===== REVIEW FILE PREVIEW ====="
          cat review-output.txt
          echo ""

      - name: Post Review as Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const reviewContent = fs.readFileSync(
              'review-output.txt',
              'utf8'
            );

            const body =
              "## 🤖 Automated PR Review\n\n" +
              reviewContent +
              "\n\n---\n*Review generated by Langflow Multi-Agent Workflow*";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Check Review Decision
        shell: bash
        run: |
          REVIEW_CONTENT=$(cat review-output.txt)

          echo "$REVIEW_CONTENT"

          if echo "$REVIEW_CONTENT" | grep -qi "^Recommendation: Request Changes"; then
            echo "❌ AI recommends request changes"
            exit 1

          else
            echo "✅ Review passed"
          fi

      - name: Upload artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: |
            pr-diff.txt
            changed-files.txt
            changed-code.txt
            payload.json
            langflow-payload.json
            response.json
            review-output.txt
