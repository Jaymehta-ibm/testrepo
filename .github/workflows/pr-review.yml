name: Automatic PR Review with A2A Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

          git diff \
            origin/${{ github.event.pull_request.base.ref }}...HEAD \
            > pr-diff.txt

      - name: Get changed files
        run: |
          git diff --name-only \
            origin/${{ github.event.pull_request.base.ref }}...HEAD \
            > changed-files.txt

      - name: Build payload
        run: |
          python3 <<'PY'
          import json
          import os

          # Read files
          with open("pr-diff.txt", "r", encoding="utf-8") as f:
              diff_content = f.read()

          with open("changed-files.txt", "r", encoding="utf-8") as f:
              changed_files = [line.strip() for line in f if line.strip()]

          pr_number = "${{ github.event.pull_request.number }}"
          pr_title = """${{ github.event.pull_request.title }}"""
          pr_body = """${{ github.event.pull_request.body }}"""
          repo = "${{ github.repository }}"
          head_ref = "${{ github.event.pull_request.head.ref }}"
          base_ref = "${{ github.event.pull_request.base.ref }}"
          author = "${{ github.event.pull_request.user.login }}"

          message = f"""
          You are a code reviewer. Please thoroughly review this pull request and provide detailed feedback.

          PR #{pr_number}: {pr_title}

          Description:
          {pr_body}

          Repository: {repo}
          Branch: {head_ref} → {base_ref}
          Author: {author}

          Changed Files:
          {json.dumps(changed_files, indent=2)}

          Code Changes (Git Diff):
          {diff_content}

          Please analyze the code changes and provide:

          1. Summary of what this PR does
          2. Bugs, security issues, or code quality problems
          3. Line-by-line feedback where applicable
          4. Suggestions for improvement
          5. Recommendation: Approve or Request Changes

          Format the response in markdown.
          """

          payload = {
              "message": message
          }

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)

          print("payload.json generated successfully")
          PY

      - name: Call A2A Agent
        run: |
          RESPONSE=$(curl -s --fail-with-body -X POST \
            "https://servicesessentials.ibm.com/agenticapps/a2a/359c48fb-1ced-489b-a8fb-f889f32b4e11/agents/82273176-2914-4ed1-b0c6-9a5fd21ba874" \
            -H "Authorization: Bearer ${{ secrets.AGENT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          echo "$RESPONSE" > response.json

          echo "===== RAW RESPONSE ====="
          cat response.json

      - name: Parse agent response
        run: |
          if jq empty response.json >/dev/null 2>&1; then

            REVIEW_CONTENT=$(jq -r '
              if .status == "error" or .error then
                "❌ Agent Error: " + (.error // .message // "Unknown error")

              elif .messages then
                (
                  .messages[]
                  | select(.role == "assistant")
                  | .content
                ) // "⚠️ No assistant response found"

              else
                .response
                // .message
                // .content
                // .output
                // "⚠️ Agent returned empty response"
              end
            ' response.json)

          else
            echo "Invalid JSON response from API"

            REVIEW_CONTENT="❌ Invalid JSON response from API.

            Check response.json artifact for details."
          fi

          echo "$REVIEW_CONTENT" > review-output.txt

          echo "===== REVIEW OUTPUT ====="
          cat review-output.txt

      - name: Post Review as Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const reviewContent = fs.readFileSync(
              'review-output.txt',
              'utf8'
            );

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Automated PR Review

${reviewContent}

---
*Review generated by A2A Agent*`
            });

      - name: Check Review Decision
        run: |
          REVIEW_CONTENT=$(cat review-output.txt)

          if echo "$REVIEW_CONTENT" | grep -qi "request changes"; then
            echo "⚠️ Agent recommends requesting changes"
            exit 1

          elif echo "$REVIEW_CONTENT" | grep -qi "approve"; then
            echo "✅ Agent approves the changes"
            exit 0

          else
            echo "ℹ️ Review completed without clear decision"
            exit 0
          fi

      - name: Upload artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: |
            pr-diff.txt
            changed-files.txt
            payload.json
            response.json
            review-output.txt
