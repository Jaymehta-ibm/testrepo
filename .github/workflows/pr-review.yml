# Quick Fix: Workflow Not Running (But Was Working Before)

## If it was working before and stopped, try these quick fixes:

### Fix 1: Push a New Commit to the PR

Sometimes the workflow needs a fresh trigger:

```bash
# On your PR branch
git commit --allow-empty -m "Trigger workflow"
git push
```

### Fix 2: Close and Reopen the PR

1. Go to the PR on GitHub
2. Click "Close pull request"
3. Wait 5 seconds
4. Click "Reopen pull request"
5. This will trigger the workflow again

### Fix 3: Check if Workflow File Was Modified

If you uploaded a new version of the workflow file:

1. **Make sure it's in the main branch:**
   ```bash
   git checkout main
   git pull
   ls .github/workflows/pr-review.yml
   ```

2. **If the file was changed, the PR needs to be updated:**
   - Close the old PR
   - Create a new PR from your branch
   - OR push a new commit to trigger the updated workflow

### Fix 4: Check Actions Tab

1. Go to your repository on GitHub
2. Click "Actions" tab
3. Look for workflow runs
4. If you see runs but they're failing:
   - Click on the failed run
   - Check which step failed
   - Look at the error message

### Fix 5: Verify API Key Still Works

The API key might have expired or been revoked:

1. Go to Settings → Secrets and variables → Actions
2. Check if `AGENT_API_KEY` exists
3. If needed, update it with: `ak_uj6VF0kVN6waD0J8WjvvKexcnmdFH2oV4TAtM2lrSHY`

### Fix 6: Check Workflow Permissions

1. Settings → Actions → General
2. Scroll to "Workflow permissions"
3. Ensure "Read and write permissions" is selected
4. Check "Allow GitHub Actions to create and approve pull requests"
5. Click "Save"

### Fix 7: Re-enable Actions (if disabled)

1. Settings → Actions → General
2. Under "Actions permissions"
3. Select "Allow all actions and reusable workflows"
4. Click "Save"

## Most Common Issue: Workflow File Location

**The workflow MUST be in `.github/workflows/` in the DEFAULT branch (main/master)**

Check:
```bash
# Switch to main
git checkout main
git pull

# Verify file exists
ls -la .github/workflows/pr-review.yml

# If it doesn't exist, add it
mkdir -p .github/workflows
# Copy pr-review.yml to .github/workflows/
git add .github/workflows/pr-review.yml
git commit -m "Add PR review workflow"
git push origin main
```

## Quick Test

Create a brand new test PR:

```bash
# Start from main
git checkout main
git pull

# Create new test branch
git checkout -b test/workflow-$(date +%s)

# Make a small change
echo "// Test $(date)" > test-file.js
git add test-file.js
git commit -m "Test workflow trigger"
git push origin HEAD

# Create PR on GitHub
```

## Check Workflow Status

1. **Go to Actions tab** - See if workflow is running
2. **Check PR page** - Look for workflow status at bottom
3. **Check workflow file** - Ensure it's in main branch

