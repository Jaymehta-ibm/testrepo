name: Automatic PR Review with A2A Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR diff
        id: get-diff
        run: |
          # Get the diff between base and head
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr-diff.txt
      
      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > changed-files.txt
      
      - name: Call A2A Agent for Review
        id: agent-review
        run: |
          # Create payload using Python to properly escape everything
          cat > create_payload.py << 'PYTHON_EOF'
import json

# Read files
with open('pr-diff.txt', 'r') as f:
    diff_content = f.read()

with open('changed-files.txt', 'r') as f:
    changed_files = [line.strip() for line in f if line.strip()]

# PR details
pr_number = "${{ github.event.pull_request.number }}"
pr_title = "${{ github.event.pull_request.title }}"
pr_body = "${{ github.event.pull_request.body }}"
repository = "${{ github.repository }}"
branch = "${{ github.event.pull_request.head.ref }}"
base_branch = "${{ github.event.pull_request.base.ref }}"
author = "${{ github.event.pull_request.user.login }}"

# Build message
message = f"""You are a code reviewer. Please thoroughly review this pull request and provide detailed feedback.

**PR #{pr_number}**: {pr_title}

**Description**: {pr_body if pr_body else 'No description provided'}

**Repository**: {repository}
**Branch**: {branch} → {base_branch}
**Author**: {author}

**Changed Files**:
{chr(10).join('- ' + f for f in changed_files)}

**Code Changes (Git Diff)**:
```diff
{diff_content[:5000]}
```

Please analyze the code changes and provide:
1. A summary of what this PR does
2. Any bugs, security issues, or code quality problems you find
3. Specific line-by-line feedback where applicable
4. Suggestions for improvements
5. Your recommendation: Approve or Request Changes

Format your response in markdown with clear sections."""

# Create payload
payload = {"message": message}

# Write JSON
print(json.dumps(payload, indent=2))
PYTHON_EOF
          
          python3 create_payload.py > payload.json
          
          # Call the A2A Agent
          RESPONSE=$(curl -s -X POST \
            "https://servicesessentials.ibm.com/agenticapps/a2a/359c48fb-1ced-489b-a8fb-f889f32b4e11/agents/82273176-2914-4ed1-b0c6-9a5fd21ba874" \
            -H "Authorization: Bearer ${{ secrets.AGENT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @payload.json)
          
          # Save response for debugging
          echo "$RESPONSE" > response.json
          
          # Debug: Show response status and first 500 chars
          echo "Response preview (first 500 chars):"
          echo "$RESPONSE" | head -c 500
          echo ""
          echo "Response length: $(echo "$RESPONSE" | wc -c) characters"
          
          # Check if response is valid JSON
          if echo "$RESPONSE" | jq empty 2>/dev/null; then
            # Extract review content from response using jq
            REVIEW_CONTENT=$(echo "$RESPONSE" | jq -r '
              if .status == "error" or .error then
                "❌ Agent Error: " + (.error // .message // "Unknown error")
              elif .messages then
                (.messages[] | select(.role == "assistant") | .content) // "⚠️ No assistant response found"
              else
                .response // .message // .content // .output // "⚠️ Agent returned empty response"
              end
            ')
          else
            # Response is not valid JSON, show raw response
            REVIEW_CONTENT="❌ Agent returned invalid JSON response. Please check the response.json artifact for details."
          fi
          
          # Save to file for next step
          echo "$REVIEW_CONTENT" > review-output.txt
          
          # Check if we got a meaningful review
          if echo "$REVIEW_CONTENT" | grep -q "Agent returned empty"; then
            echo "⚠️ Warning: Agent did not provide detailed review"
            echo "Check response.json artifact for details"
          fi
          
          # Set output for GitHub Actions
          {
            echo "review<<EOF"
            cat review-output.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT
      
      - name: Post Review as Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewContent = fs.readFileSync('review-output.txt', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Automated PR Review\n\n${reviewContent}\n\n---\n*Review generated by A2A Agent*`
            });
      
      - name: Check Review Decision
        run: |
          REVIEW_CONTENT=$(cat review-output.txt)
          
          if echo "$REVIEW_CONTENT" | grep -qi "request changes"; then
            echo "⚠️ Agent recommends requesting changes"
            exit 1
          elif echo "$REVIEW_CONTENT" | grep -qi "approve"; then
            echo "✅ Agent approves the changes"
            exit 0
          else
            echo "ℹ️ Review completed without clear decision"
            exit 0
          fi
      
      - name: Upload artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: |
            pr-diff.txt
            payload.json
            response.json
            review-output.txt

