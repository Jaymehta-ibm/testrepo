name: Automatic PR Review with Langflow Multi-Agent

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  pull-requests: write
  contents: read

jobs:
  review-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        shell: bash
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

          git diff \
            origin/${{ github.event.pull_request.base.ref }}...HEAD \
            > pr-diff.txt

      - name: Get changed files
        shell: bash
        run: |
          git diff --name-only \
            origin/${{ github.event.pull_request.base.ref }}...HEAD \
            > changed-files.txt

      - name: Collect changed file contents
        shell: bash
        run: |
          rm -f changed-code.txt
          touch changed-code.txt

          while IFS= read -r file
          do
            if [ -f "$file" ]; then

              echo "======================" >> changed-code.txt
              echo "FILE: $file" >> changed-code.txt
              echo "======================" >> changed-code.txt

              cat "$file" >> changed-code.txt

              echo "" >> changed-code.txt
              echo "" >> changed-code.txt

            fi
          done < changed-files.txt

      - name: Build payload
        shell: bash
        run: |
          python3 <<'PYTHON_EOF' > payload.json
          import json

          with open("pr-diff.txt", "r", encoding="utf-8") as f:
              diff_content = f.read()

          with open("changed-files.txt", "r", encoding="utf-8") as f:
              changed_files = [
                  line.strip()
                  for line in f
                  if line.strip()
              ]

          with open("changed-code.txt", "r", encoding="utf-8") as f:
              code_content = f.read()

          message = f"""
          You are a senior software engineer performing a deep pull request review.

          Your goal is to provide REAL engineering feedback,
          not generic CI/CD or security observations.

          Focus heavily on:
          - runtime bugs
          - edge cases
          - code quality
          - maintainability
          - architecture
          - readability
          - scalability
          - naming
          - duplication
          - validation issues
          - null/undefined safety
          - performance
          - bad practices
          - testing gaps
          - API misuse

          IMPORTANT:
          - Give SPECIFIC code-level feedback
          - Reference actual functions and code patterns
          - Suggest exact fixes
          - Explain WHY something is risky
          - Provide improved code examples where useful
          - Avoid generic comments
          - Only recommend "Request Changes" for critical runtime failures, security vulnerabilities, or severe GenAI workflow risks.
          - Minor improvements, refactoring suggestions, documentation feedback, maintainability recommendations, or style issues should still result in "Recommendation: Approve".
          - Do NOT recommend "Request Changes" for optimization suggestions, scalability improvements, naming improvements, documentation enhancements, or non-breaking edge-case refinements.
          
          Repository:
          ${{ github.repository }}

          PR Number:
          ${{ github.event.pull_request.number }}

          Title:
          ${{ github.event.pull_request.title }}

          Author:
          ${{ github.event.pull_request.user.login }}

          Head Branch:
          ${{ github.event.pull_request.head.ref }}

          Base Branch:
          ${{ github.event.pull_request.base.ref }}

          Changed Files:
          {chr(10).join(changed_files)}

          Git Diff:
          {diff_content[:15000]}

          Full Changed File Contents:
          {code_content[:60000]}

          Structure the response EXACTLY like this:

          1. Summary

          2. What looks good

          3. Key issues
          - Explain each issue clearly
          - Include code examples
          - Explain runtime impact

          4. Style and maintainability feedback

          5. Architectural concerns

          6. Documentation suggestions

          7. Test coverage suggestions

          8. Suggested safer implementation

          9. Final assessment

          IMPORTANT:
          This should feel like a real senior engineer PR review.
          """

          payload = {
              "message": message
          }

          print(json.dumps(payload))
          PYTHON_EOF

      - name: Call Langflow Multi-Agent Workflow
        shell: bash
        run: |
          # Extract message from payload
          MESSAGE=$(cat payload.json | jq -r '.message')
          
          # Cap payload size to prevent timeouts (max 50KB)
          MESSAGE_SIZE=$(echo "$MESSAGE" | wc -c)
          MAX_SIZE=51200  # 50KB
          
          if [ "$MESSAGE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "⚠️ Payload too large ($MESSAGE_SIZE bytes), truncating to $MAX_SIZE bytes"
            MESSAGE=$(echo "$MESSAGE" | head -c $MAX_SIZE)
            MESSAGE="$MESSAGE\n\n... [Truncated due to size limit. Full diff available in PR.]"
          fi
          
          # Generate truly unique session ID with timestamp and random component
          TIMESTAMP=$(date +%s%N)
          RANDOM_ID=$(cat /dev/urandom | tr -dc 'a-z0-9' | fold -w 8 | head -n 1)
          SESSION_ID="pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${TIMESTAMP}-${RANDOM_ID}"
          
          # Build the input payload for Langflow with correct format
          # DO NOT include thread_id - let ICA generate its own unique thread ID
          # This prevents checkpoint conflicts from reused thread IDs
          LANGFLOW_PAYLOAD=$(jq -n \
            --arg msg "$MESSAGE" \
            --arg session "$SESSION_ID" \
            '{
              "output_type": "chat",
              "input_type": "chat",
              "input_value": $msg,
              "session_id": $session,
              "tweaks": {
                "clear_history": true
              }
            }')
          
          echo "$LANGFLOW_PAYLOAD" > langflow-payload.json
          echo "Payload size: $MESSAGE_SIZE bytes"
          echo "Payload preview:"
          cat langflow-payload.json | head -c 500
          echo "..."
          
          # Call Langflow with correct FLOW_ID and stream=false parameter
          # Add --max-time to prevent hanging (5 minutes timeout)
          echo "Calling Langflow Flow ID: 39b731f3-5f2a-4e7a-a247-2271d864c909"
          echo "Session ID: $SESSION_ID"
          echo "Timeout: 300 seconds (5 minutes)"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 300 -X POST \
            "https://langflow.servicesessentials.ibm.com/api/v1/run/39b731f3-5f2a-4e7a-a247-2271d864c909?stream=false" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.LANGFLOW_API_KEY }}" \
            -d @langflow-payload.json)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status Code: $HTTP_CODE"
          
          # Check for curl timeout (exit code 28)
          if [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "❌ Langflow API call timed out after 5 minutes"
            echo "⚠️ The flow is taking too long to process. Consider:"
            echo "   1. Reducing the PR diff size"
            echo "   2. Optimizing the Langflow flow"
            echo "   3. Creating a simpler/faster flow for CI"
            exit 1
          fi
          
          # Check if request succeeded
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Langflow API call failed with status $HTTP_CODE"
            echo "Full response:"
            echo "$RESPONSE_BODY"
            exit 1
          fi
          
          echo "✅ Langflow API call succeeded"
          
          # Save response to file
          echo "$RESPONSE_BODY" > response.json
          RESPONSE="$RESPONSE_BODY"
          
          echo "Response saved to response.json"
          echo "Response size: $(echo "$RESPONSE_BODY" | wc -c) bytes"

          if [ -n "$RESPONSE" ] && echo "$RESPONSE" | jq empty >/dev/null 2>&1; then

            # Parse response with timeout (30 seconds max for jq)
            REVIEW_CONTENT=$(timeout 30 bash -c 'echo "$1" | jq -r '"'"'
              if .status == "error" or .error then
                "❌ Langflow Error: " + (.error // .message // "Unknown error")

              elif .outputs then
                # Langflow multi-agent response format
                # Extract outputs from all agents and combine them
                if (.outputs | length) > 0 then
                  (
                    # Try to get all agent outputs
                    [.outputs[].outputs[]?.results.message.text // .outputs[].outputs[]?.results.text // .outputs[].outputs[]?.message]
                    | map(select(. != null))
                    | if length > 0 then
                        # Combine all agent outputs with separators
                        "## 📊 Agent 1: Comprehensive Technical Review\n\n" + .[0] +
                        (if length > 1 then "\n\n---\n\n## 🎨 Agent 2: Code Quality Score\n\n" + .[1] else "" end) +
                        (if length > 2 then "\n\n---\n\n## 📋 Agent 3: Additional Analysis\n\n" + .[2] else "" end)
                      else
                        "⚠️ No output found in Langflow response"
                      end
                  )
                else
                  "⚠️ No outputs array in response"
                end
              '"'"' || echo "⚠️ Response parsing timed out"' -- "$RESPONSE")

              elif .messages then
                # A2A format (fallback)
                (
                  .messages[]
                  | select(.role == "assistant")
                  | .content
                ) // "⚠️ No assistant response found"

              else
                .response
                // .message
                // .content
                // .output
                // "⚠️ Workflow returned empty response"
              end
            ')

          else
            REVIEW_CONTENT="❌ Invalid JSON response from API"
          fi

          echo "$REVIEW_CONTENT" > review-output.txt

      - name: Post Review as Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const reviewContent = fs.readFileSync(
              'review-output.txt',
              'utf8'
            );

            const body =
              "## 🤖 Automated PR Review\n\n" +
              reviewContent +
              "\n\n---\n*Review generated by Langflow Multi-Agent Workflow*";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Check Review Decision
        shell: bash
        run: |
          REVIEW_CONTENT=$(cat review-output.txt)
      
          echo "$REVIEW_CONTENT"
      
          if echo "$REVIEW_CONTENT" | grep -Eiq "(critical runtime failure|security vulnerability|severe GenAI workflow risk)"; then
            echo "❌ Critical issues detected"
            exit 1
      
          else
            echo "✅ Review passed with suggestions"
          fi

      - name: Upload artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: |
            pr-diff.txt
            changed-files.txt
            changed-code.txt
            payload.json
            langflow-payload.json
            response.json
            review-output.txt
