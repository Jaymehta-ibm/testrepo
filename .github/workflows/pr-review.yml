name: Automatic PR Review with A2A Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR diff
        id: get-diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr-diff.txt
          
          # Limit diff size to prevent payload issues
          head -n 500 pr-diff.txt > pr-diff-limited.txt
          mv pr-diff-limited.txt pr-diff.txt
      
      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > changed-files.txt
      
      - name: Call A2A Agent for Review
        id: agent-review
        run: |
          # Read diff content
          DIFF_CONTENT=$(cat pr-diff.txt)
          
          # Read changed files
          FILES_LIST=$(cat changed-files.txt | tr '\n' ', ' | sed 's/,$//')
          
          # Create simple JSON payload
          cat > payload.json <<EOF
          {
            "message": "Please review this pull request:\n\nPR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}\n\nFiles changed: ${FILES_LIST}\n\nCode diff:\n${DIFF_CONTENT}\n\nProvide detailed feedback on code quality, bugs, and security issues."
          }
          EOF
          
          echo "Calling agent..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://servicesessentials.ibm.com/agenticapps/a2a/359c48fb-1ced-489b-a8fb-f889f32b4e11/agents/82273176-2914-4ed1-b0c6-9a5fd21ba874" \
            -H "Authorization: Bearer ${{ secrets.AGENT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @payload.json)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "$RESPONSE_BODY" > response.json
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Agent responded successfully"
            
            # Try to extract review content
            REVIEW=$(echo "$RESPONSE_BODY" | python3 -c "
          import sys, json
          try:
              data = json.loads(sys.stdin.read())
              content = data.get('response', data.get('message', data.get('content', data.get('output', 'No review content found'))))
              print(content)
          except:
              print('Error parsing response')
              print(sys.stdin.read())
          " 2>&1)
            
            echo "$REVIEW" > review-output.txt
          else
            echo "❌ Error: HTTP $HTTP_CODE"
            echo "Response: $RESPONSE_BODY"
            echo "❌ Error: Agent returned HTTP $HTTP_CODE" > review-output.txt
            echo "" >> review-output.txt
            echo "Response: $RESPONSE_BODY" >> review-output.txt
          fi
          
          {
            echo "review<<EOF"
            cat review-output.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT
      
      - name: Post Review as Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewContent = fs.readFileSync('review-output.txt', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Automated PR Review\n\n${reviewContent}\n\n---\n*Review generated by A2A Agent*`
            });
      
      - name: Check Review Decision
        run: |
          REVIEW_CONTENT=$(cat review-output.txt)
          
          if echo "$REVIEW_CONTENT" | grep -qi "Error:"; then
            echo "⚠️ Agent encountered an error"
            exit 0
          elif echo "$REVIEW_CONTENT" | grep -qi "request changes"; then
            echo "⚠️ Agent recommends requesting changes"
            exit 1
          elif echo "$REVIEW_CONTENT" | grep -qi "approve"; then
            echo "✅ Agent approves the changes"
            exit 0
          else
            echo "ℹ️ Review completed"
            exit 0
          fi
      
      - name: Upload artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: |
            pr-diff.txt
            payload.json
            response.json
            review-output.txt

